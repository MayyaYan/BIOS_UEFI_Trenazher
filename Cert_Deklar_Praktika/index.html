tyle></head><body><header><div class="brand">⚖️ СЕРТИФИКАТ И ДЕКЛАРАЦИЯ · ПРАКТИКА</div><span id="count" class="pill"></span></header><main><section class="slide" id="slide"><div id="head"></div><div class="body"><div class="copy" id="copy"></div><div class="visual" id="visual"></div></div></section></main><footer><button class="nav" id="prev" onclick="move(-1)">← Назад</button><span class="mini">Задания · Без таймера</span><button class="nav" id="next" onclick="move(1)">Далее →</button></footer><script>const SLIDES=[{"type": "intro", "tag": "СТАРТ · ПРАКТИЧЕСКИЙ ТРЕНАЖЁР", "title": "Лаборатория проверки документов", "desc": "Вы — специалист по информационным системам. Организация закупает оборудование для учебного центра. Ваша задача — проверить, что документы о соответствии относятся к нужной продукции, правильно оформлены и позволяют принять обоснованное решение. Сначала вы тренируетесь на учебных карточках, после этого проверяете реальные опубликованные материалы и готовите презентацию.", "points": ["Найдите сведения, которые действительно подтверждают соответствие.", "Соберите порядок действий двух процедур.", "Проверяйте дату, модель, технический регламент и реестр.", "Сохраните результаты и переходите к самостоятельной работе."], "icon": "📂"}, {"type": "lecture", "tag": "ИНСТРУКЦИЯ · 1/2", "title": "Как проверять документ", "desc": "Сертификат соответствия оформляет орган по сертификации на основании предусмотренной схемой оценки. Декларацию о соответствии принимает заявитель и регистрирует в установленном порядке. Обе формы применяются в установленных случаях, а не по свободному выбору покупателя.", "points": ["Определите вид документа и его регистрационный номер.", "Сверьте наименование продукции, модель, изготовителя и заявителя.", "Прочитайте технический регламент и основание подтверждения.", "Установите срок действия и статус в официальном реестре."], "icon": "🧾"}, {"type": "lecture", "tag": "ИНСТРУКЦИЯ · 2/2", "title": "Что значит «обнаружить несоответс  решение о выдаче сертификата", "Проверить регистрацию и применять документ по назначению"], "icon": "🔗"}, {"type": "sort", "tag": "ИГРА 4 · ПОСТРОЙ ЦЕПОЧКУ", "title": "Порядок декларирования", "desc": "Соберите учебную последовательность действий заявителя. Конкретные доказательства и лаборатория зависят от установленной схемы.", "items": ["Определить применимый технический регламент и схему", "Идентифицировать продукцию и собрать документацию", "Получить необходимые доказательства соответствия", "Принять декларацию заявителем", "Зарегистрировать декларацию установленным способом", "Проверить запись в реестре и выполнить требования к маркировке"], "icon": "🧩"}, {"type": "match", "tag": "ИГРА 5 · СОПОСТАВЛЕНИЕ", "title": "Документ и доказательство", "desc": "Для каждого вопроса выберите соответствующее доказательство.", "rows": [{"q": "Удостовериться, что документ относится к поставке", "options": ["Совпадение модели и описания продукции", "Цвет логотипа на сайте", "Дата оформления накладной"], "a": 0}, {"q": "Удостовериться, что документ зарегистрирован", "options": ["Рекламный буклет поставщика", "Официальная запись в реестре", "Слова менеджера"], "a": 1}, {"q": "Подтвердить результаты испытаний", "options": ["Наличие протокола с данными образца", "Цена комплекта", "Количество просмотров карточки товара"], "a": 0}], "icon": "📑"}, {"type": "case", "tag": "ИГРА 6 · РАЗБОР СИТУАЦИИ", "title": "Срок документа закончился", "desc": "Поставщик приложил сертификат со сроком окончания 08.12.2025, а поставка планируется в ноябре 2026 года. Сведения о дате выпуска и выпуске продукции в обращение не предоставлены.", "question": "Какое решение наиболее обоснованно?", "options": ["Принимать без проверок: номер сертификата существует", "Не считать документ достаточным: запросить дату выпуска и сведения из реестра, проверить применимость к конкретной партии", "Считать поддельными любые документы с истекшим сроком"], "answer": 1, "explain": "Окончание срока не доказывает подделку и не всегда означает запрет обращения ранее выпущенной продукции. Но для новой поставки нужны дополнительные сведения.", "icon": "📅"}, {"type": "case", "tag": "ИГРА 7 · РАЗБОР СИТУАЦИИ", "title": "Не совпадает модель", "desc": "На коробке указана модель UBA-LUX-503-TC. В выписке документа перечислены иные серии и нет этой модели; приложение к документу поставщик не предоставил.", "question": "Что должен сделать специалист?", "options": ["Проверить полную область действия и запросить недостающее приложение", "Подтвердить соответствие только по логотипу", "Считать любую модель того же бренда подходящей"], "answer": 0, "explain": "Нужно сопоставить точные характеристики и комплектацию: бренд сам по себе не подтверждает охват модели.", "icon": "🧷"}, {"type": "case", "tag": "ИГРА 8 · РАЗБОР СИТУАЦИИ", "title": "Протокол — не сертификат", "desc": "Поставщик прислал только протокол испытаний с положительными результатами, но требуемую форму подтверждения соответствия и реестровую запись не представил.", "question": "Что верно?", "options": ["Протокол всегда заменяет документ о соответствии", "Можно пропустить проверку реестра", "Протокол является доказательством, но не заменяет требуемый сертификат или декларацию"], "answer": 2, "explain": "Протокол — часть доказательственной базы, а не универсальный документ, разрешающий обращение продукции.", "icon": "🧪"}, {"type": "multi", "tag": "ИГРА 9 · НАЙДИ ВСЕ ПРИЗНАКИ", "title": "Что проверить в реестре?", "desc": "Отметьте все признаки, которые нужны для обоснованного сопоставления.", "options": ["Регистрационный номер и статус документа", "Заявитель, изготовитель и продукция", "Сроки, область действия и применимый регламент", "Количество лайков на странице товара"], "correct": [0, 1, 2], "icon": "✅"}, {"type": "quiz", "tag": "ИГРА 10 · МАРКИРОВКА", "title": "Как оценить знак ЕАС?", "question": "Можно ли по одному изображению знака ЕАС доказать действительность документа?", "options": ["Да, всегда", "Нет, нужно проверить примени 2" height="8" rx="4" fill="#85d2e7"/><rect x="49" y="125" width="69" height="8" rx="4" fill="#85d2e7"/><path d="M150 140H280m-18 -20 20 20 -20 20" fill="none" stroke="#63e4c5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="345" cy="143" r="55" fill="#14765b" stroke="#7df8d1" stroke-width="5"/><path d="m315 143 20 23 42-51" fill="none" stroke="#f4ffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="250" text-anchor="middle" font-size="24" font-weight="bold" fill="#b4eaff">${text}</text></svg><div class="words">${symbol} · ${text}</div><div class="foot">Учебная схема · без внешних ресурсов</div>`}function move(d){if(n===0&&d>0){student=$('fio').value.trim();group=$('group').value.trim();if(!student||!group)return alert('Введите фамилию, имя и группу')}if(SLIDES[n].type==='finish')longAnswer=$('conclusion').value;n=Math.max(0,Math.min(n+d,SLIDES.length-1));render()}function saveChoice(i){resp[n]=i;render()}function choiceHTML(s){let answered=resp[n]!==undefined;return `<p><strong>${esc(s.question)}</strong></p>`+s.options.map((o,i)=>`<button ${answered?'disabled':''} class="option ${answered?(i===s.answer?'good':i===resp[n]?'bad':''):''}" onclick="saveChoice(${i})">${esc(o)}</button>`).join('')+(answered?`<div class="feedback">${resp[n]===s.answer?'✓ Верно. ':'✦ Исправьте вывод. '}${esc(s.explain)}</div>`:'')}function initializeSort(s){if(!order[n])order[n]=[...s.items.keys()].reverse()}function swap(dir,i){initializeSort(SLIDES[n]);let o=order[n],j=i+dir;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];render()}function verifySort(){resp[n]=order[n].every((x,i)=>x===i);render()}function matchSet(ri,oi){if(!resp[n]||typeof resp[n]!=='object')resp[n]={};resp[n][ri]=oi;render()}function verifyMatch(){let s=SLIDES[n];if(!resp[n])resp[n]={};resp[n].checked=s.rows.every((r,i)=>resp[n][i]===r.a);render()}function multiPick(i){if(!Array.isArray(resp[n]))resp[n]=[];resp[n]=resp[n].includes(i)?resp[n].filter(x=>x!==i):[...resp[n],i];render()}function checkMulti(){let s=SLIDES[n];let a=Array.isArray(resp[n])?resp[n]:[];resp[n]={selected:a,correct:a.length===s.correct.length&&s.correct.every(i=>a.includes(i))};render()}function content(s){if(s.type==='intro')return `<p class="blurb">${esc(s.desc)}</p><label>Фамилия и имя<input id="fio" value="${esc(student)}" placeholder="Фамилия Имя"></label><label>Группа<input id="group" value="${esc(group)}" placeholder="Группа"></label>`+bullets(s.points);if(s.type==='lecture')return `<p class="blurb">${esc(s.desc)}</p>`+bullets(s.points);if(s.type==='quiz'||s.type==='case')return (s.desc?`<div class="bullet">${esc(s.desc)}</div>`:'')+choiceHTML(s);if(s.type==='sort'){initializeSort(s);let o=order[n],evaluated=resp[n]!==undefined;return `<p class="blurb">${esc(s.desc)}</p>${o.map((idx,i)=>`<div class="step ${evaluated?(idx===i?'correct':'wrong'):''}"><b>${i+1}</b><span>${esc(s.items[idx])}</span><button ${evaluated?'disabled':''} onclick="swap(-1,${i})">↑</button><button ${evaluated?'disabled':''} onclick="swap(1,${i})">↓</button></div>`).join('')}<button class="smallBtn" ${evaluated?'disabled':''} onclick="verifySort()">Проверить цепочку</button>${evaluated?`<div class="feedback">${resp[n]?'✓ Цепочка собрана верно.':'Есть нарушения порядка: зелёные строки стоят на правильных местах, красные переместите при повторном прохождении.'}</div>`:''}`;}if(s.type==='match'){let current=resp[n]&&typeof resp[n]==='object'?resp[n]:{};return `<p>${esc(s.desc)}</p>`+s.rows.map((row,i)=>`<div class="rowq"><b>${i+1}. ${esc(row.q)}</b><div class="choice">${row.options.map((op,j)=>`<button class="${current[i]===j?'selected':''}" ${current.checked!==undefined?'disabled':''} onclick="matchSet(${i},${j})">${esc(op)}</button>`).join('')}</div></div>`).join('')+`<button class="smallBtn" onclick="verifyMatch()" ${current.checked!==undefined?'disabled':''}>Проверить все соответствия</button>`+(current.checked!==undefined?`<div class="feedback">${current.checked?'✓ Всё верно.':'Часть соответствий неверна: проверьте доказательства ещё раз.'}</div>`:'')}if(s.type==='multi'){let data=resp[n],done=data&&!Array.isArray(data),chosen=done?data.selected:Array.isArray(data)?data:[];return `<p>${esc(s.desc)}</p>`+s.options.map((x,i)=>`<button class="option ${done?(s.correct.includes(i)?'good':chosen.includes(i)?'bad':''):''}" ${done?'disabled':''} onclick="multiPick(${i})">${chosen.includes(i)?'☑':'☐'} ${esc(x)}</button>`).join('')+`<button class="smallBtn" ${done?'disabled':''} onclick="checkMulti()">Проверить</button>`+(done?`<div class="feedback">${data.correct?'✓ Выбраны все необходимые признаки.':'Проверьте полный набор: статус, участники и область действия документа.'}</div>`:'');}if(s.type==='finish'){let total=SLIDES.filter((s,i)=>['quiz','case','sort','match','multi'].includes(s.type)&&resp[i]!==undefined).length;let passed=SLIDES.filter((s,i)=>['quiz','case'].includes(s.type)?resp[i]===s.answer:s.type==='sort'?resp[i]===true:s.type==='match'?resp[i]&&resp[i].checked===true:s.type==='multi'?resp[i]&&resp[i].correct===true:false).length;return `<p>${esc(s.desc)}</p><p class="points">Верных игр: ${passed} из 10 · выполнено: ${total} из 10</p><textarea id="conclusion" placeholder="Факт → проверка → решение">${esc(longAnswer)}</textarea><p><button class="nav" onclick="download()">Сохранить отчёт (.txt)</button></p>`}}function bullets(a){return `<div class="bullets">${(a||[]).map(x=>`<div class="bullet">${esc(x)}</div>`).join('')}</div>`}function render(){let s=SLIDES[n];$('count').textContent=`${n+1} / ${SLIDES.length}`;$('prev').disabled=n===0;$('next').disabled=n===SLIDES.length-1;$('slide').classList.toggle('game',['quiz','sort','match','case','multi'].includes(s.type));$('head').innerHTML=`<span class="tag">${esc(s.tag)}</span><h1>${esc(s.title)}</h1>`;$('copy').innerHTML=content(s);$('visual').innerHTML=art(s);$('copy').scrollTop=0}function download(){longAnswer=$('conclusion').value;let x=[`Практика: сертификат и декларация`,`ФИО: ${student}`,`Группа: ${group}`,''];SLIDES.forEach((s,i)=>{if(['quiz','case','sort','match','multi'].includes(s.type))x.push(s.title+': '+(resp[i]===undefined?'нет ответа':s.type==='sort'?(resp[i]?'верно':'неверно'):s.type==='match'?(resp[i].checked?'верно':'неверно'):s.type==='multi'?(resp[i].correct?'верно':'неверно'):(resp[i]===s.answer?'верно':'неверно')))});x.push('', 'Заключение: ',longAnswer);let b=new Blob([x.join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Практикум_сертификат_декларация.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();</script></body></html>
