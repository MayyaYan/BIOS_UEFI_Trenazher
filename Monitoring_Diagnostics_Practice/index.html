<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практикум: мониторинг и диагностика</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#081d34;color:white;font:26px/1.4 Arial;margin:0}header,footer{background:#0b2b49;padding:14px 25px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:20px auto;padding:28px;background:linear-gradient(120deg,#143c61,#12243e);border:2px solid #4dbbff;border-radius:23px;min-height:65vh}h1{font-size:38px}p{margin:14px 0}.option{display:block;padding:15px 20px;margin:12px 0;width:100%;border-radius:14px;font:inherit;text-align:left;background:#374b94;color:white;border:2px solid #a6b6ff;cursor:pointer}.correct{background:#186f58}.wrong{background:#8a374c}.nav{background:#64c9f7;color:#03253a;border:0;border-radius:13px;font:inherit;padding:10px 20px;cursor:pointer}input,textarea{font:inherit;padding:10px;color:#fff;background:#0b304d;border:1px solid #5ebbed;border-radius:10px}textarea{width:100%;height:170px}.case{background:#0c3453;padding:18px;border-radius:12px;border-left:6px solid #5fe2c5}#feedback{padding:12px;color:#a9ffd6}footer{gap:15px}@media(max-width:750px){body{font-size:21px}main{margin:8px;padding:15px}h1{font-size:29px}}</style></head><body><header><b>🖥️ ПРАКТИКУМ · МОНИТОРИНГ И БЕЗОПАСНОСТЬ</b><span id="count"></span></header><main><div id="view"></div></main><footer><button class="nav" onclick="move(-1)">← Назад</button><span id="progress"></span><button class="nav" onclick="move(1)">Далее →</button></footer><script>const tasks=[{"title":"Изучите состояние сервера","text":"На файловом сервере свободная память падает с 6,8 до 4,7 гигабайта, а задержка диска растёт с 8 до 64 миллисекунд.","q":"Какую проблему следует исследовать прежде всего?","o":["Устойчивый рост задержки дисковых операций","Поломку экрана администратора","Недостаток заряда аккумулятора"],"a":0,"why":"Наблюдаемая задержка диска превышает учебный порог и требует проверки причины."},{"title":"Сопоставьте данные","text":"В 02:04 журнал копирования сообщил о нехватке места, в 02:05 задание завершилось с кодом ошибки.","q":"Какой вывод доказан?","o":["Копирование завершилось неуспешно","Все старые копии повреждены","Заражение доказано"],"a":0,"why":"Журналы подтверждают сбой копирования, но не состояние всех старых копий."},{"title":"Разделите факт и гипотезу","text":"Пользователи сообщают о медленном доступе к общей папке, запись диска показывает высокую задержку.","q":"Что из следующего является гипотезой?","o":["В 09:00 задержка была 64 миллисекунды","Диск может иметь перегрузку входящих запросов","Сотрудники сообщили о замедлении"],"a":1,"why":"Причину требуется подтвердить дополнительными измерениями."},{"title":"Выберите способ подтверждения","text":"Есть предупреждение о повышенной задержке диска E:.","q":"Какие данные полезно собрать?","o":["Очередь операций, задержки чтения и записи, свободное место","Только цвет обоев","Только имя директора"],"a":0,"why":"Нужны данные, отражающие работу накопителя."},{"title":"Проверьте сценарий копирования","text":"Для новой копии нужно 22 ГБ, рабочий запас — 5 ГБ, свободно 48 ГБ.","q":"Поместятся ли две полные копии с запасом?","o":["Да, останется 9 ГБ","Нет, требуется 49 ГБ, не хватает 1 ГБ","Нет, требуется 80 ГБ"],"a":1,"why":"22 + 22 + 5 = 49 гигабайт, доступно 48."},{"title":"Оцените пригодность копии","text":"B-101 прошла тест открытия трёх файлов; B-102 содержит нечитаемый контрольный файл.","q":"Что обоснованно сделать?","o":["Проверить B-101 по плану восстановления и не считать B-102 надёжной","Удалить B-101","Объявить все копии исправными"],"a":0,"why":"Результат восстановления важнее факта существования копии."},{"title":"Составьте мониторинг","text":"Внутреннее учебное правило — тревога после двух последовательных превышений задержки диска 40 мс.","q":"Какое правило уменьшает ложные тревоги?","o":["Тревога при одном случайном пике","Тревога при двух последовательных превышениях","Полное отключение мониторинга"],"a":1,"why":"Несколько наблюдений помогают отличить кратковременные пики от устойчивых отклонений."},{"title":"Проработайте действия при ошибке","text":"Сценарий не смог записать копию на сетевое хранилище.","q":"Как правильно реагировать?","o":["Записать ошибку, остановить опасные действия, уведомить ответственного","Удалить последнюю рабочую копию","Игнорировать ошибку"],"a":0,"why":"Нельзя уничтожать единственную проверенную копию при сбое."}];let n=0,answers={},fio="",group="",report="";function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('count').textContent='Экран '+(n+1)+' из 11';document.getElementById('progress').textContent='Переходы вправо и влево';let v=document.getElementById('view');if(n===0)v.innerHTML='<h1>Практическая лаборатория</h1><p>Это первый этап. Далее вас ждёт сложное расследование в Word с новыми исходными данными.</p><p>ФИО <input id="fio" value="'+esc(fio)+'"></p><p>Группа <input id="group" value="'+esc(group)+'"></p>';else if(n<=8){let t=tasks[n-1];v.innerHTML='<h1>'+esc(t.title)+'</h1><div class="case">'+esc(t.text)+'</div><p><b>'+esc(t.q)+'</b></p>'+t.o.map((x,i)=>'<button class="option" onclick="choose('+i+')">'+esc(x)+'</button>').join('')+'<div id="feedback"></div>';if(answers[n]!==undefined)decorate();}else if(n===9)v.innerHTML='<h1>Диагностическое заключение</h1><p>Опишите подтверждённый симптом, две возможные причины и данные для дополнительной проверки.</p><textarea id="report">'+esc(report)+'</textarea>';else v.innerHTML='<h1>Результаты</h1><p>Правильных ответов: '+tasks.filter((t,i)=>answers[i+1]===t.a).length+' из '+tasks.length+'</p><p>Следующий этап — расследование инфраструктурного сбоя и разработка схемы безопасного копирования в Word.</p><button class="nav" onclick="download()">Сохранить ответы (.txt)</button>'}function choose(i){if(answers[n]!==undefined)return;answers[n]=i;decorate()}function decorate(){let t=tasks[n-1];document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;b.classList.add(i===t.a?'correct':(i===answers[n]?'wrong':''))});document.getElementById('feedback').textContent=(answers[n]===t.a?'Верно. ':'Нужно уточнить. ')+t.why}function move(d){if(n===0){fio=document.getElementById('fio').value;group=document.getElementById('group').value;if(d>0&&(!fio.trim()||!group.trim()))return alert('Введите ФИО и группу')}if(n===9)report=document.getElementById('report').value;n=Math.max(0,Math.min(10,n+d));render()}function download(){let s='Практикум. Мониторинг и диагностика\n'+fio+' / '+group+'\n';tasks.forEach((t,i)=>s+='\n'+t.q+'\nОтвет: '+(answers[i+1]===undefined?'Не выбран':t.o[answers[i+1]])+'\n');s+='\nЗаключение:\n'+report;let b=new Blob([s],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Ответы_практикум_мониторинг.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();</script></body></html>
