<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Практическая лаборатория — Мониторинг и диагностика</title>
<style>
:root{color-scheme:dark;--bg:#081d34;--pane:#123653;--a:#73dcff;--good:#188465;--bad:#9e4050}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Segoe UI",sans-serif}body{background:var(--bg);color:#f5fbff;font-size:clamp(20px,2.05vw,30px);line-height:1.42;display:flex;flex-direction:column;min-height:100dvh}
header{background:#0c2944;padding:12px max(16px,3vw);display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:2px solid #376b91}
header b{font-size:clamp(19px,2.2vw,30px)}main{flex:1;width:min(1260px,98%);margin:15px auto;background:linear-gradient(120deg,#143c61,#11283f);border:2px solid #438fbd;border-radius:22px;padding:clamp(15px,2.6vw,30px);min-height:400px}
h1{font-size:clamp(29px,3vw,43px);line-height:1.18;margin:5px 0 17px}
p{margin:15px 0}.case{background:#0b304c;border-left:8px solid #5ce9ca;padding:18px;border-radius:12px}
.options{display:grid;gap:12px;margin:20px 0}.option{font:inherit;color:#fff;text-align:left;cursor:pointer;display:block;width:100%;background:#334b92;border:2px solid #a4b5ff;border-radius:14px;padding:16px;transition:background .12s}
.option:hover,.option:focus-visible{outline:4px solid #f6d875;outline-offset:2px}
.option.chosen{border:4px solid #fbe277}.option.correct{background:var(--good)}.option.incorrect{background:var(--bad)}
.feedback{background:#0d2c46;border-left:7px solid #63e8b2;border-radius:9px;padding:14px;margin-top:17px}
footer{position:sticky;bottom:0;background:#0c2944;padding:13px max(14px,3vw);border-top:2px solid #376b91;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:10}
button.action{font:inherit;font-weight:700;border:0;border-radius:12px;background:#64d0f9;color:#062639;padding:12px 20px;cursor:pointer}
button.action:focus-visible{outline:4px solid #f9d36e}
button.action:disabled{opacity:.4;cursor:not-allowed}
input,textarea{font:inherit;padding:12px;color:#fff;background:#092b48;border:2px solid #80cbee;border-radius:10px;max-width:100%;width:min(680px,100%)}
textarea{height:220px;display:block;width:100%}.form-row{margin:20px 0}.form-row label{display:block;margin-bottom:5px}
.muted{color:#c5def3}.summary{background:#0b304d;padding:18px;border-radius:14px;margin:15px 0}
.export-grid{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.export-grid button{flex:1;min-width:185px}
details{margin-top:15px}summary{cursor:pointer}
@media(max-width:600px){footer{padding:12px;gap:7px}footer button.action{font-size:18px;padding:12px 10px}#progress{font-size:17px;text-align:center}main{width:100%;border-radius:0;margin:0;border-left:0;border-right:0}header{font-size:18px}}
@media print{header,footer,.export-grid{display:none!important}body{background:white;color:black;font-size:12pt}main{width:100%;border:0;background:white;padding:0}.case,.summary{background:white;color:black;border:1px solid #aaa}}
</style></head><body>
<header><b>🛡️ Практикум: мониторинг и диагностика</b><span id="counter" aria-live="polite"></span></header>
<main><section id="view" aria-live="polite"></section></main>
<footer><button class="action" id="back" type="button">← Назад</button><span id="progress">Горизонтальные переходы</span><button class="action" id="next" type="button">Далее →</button></footer>
<script>
"use strict";
const tasks=[{"title":"Изучите состояние сервера","text":"На файловом сервере свободная память падает с 6,8 до 4,7 гигабайта, а задержка диска растёт с 8 до 64 миллисекунд.","q":"Какую проблему следует исследовать прежде всего?","o":["Устойчивый рост задержки дисковых операций","Поломку экрана администратора","Недостаток заряда аккумулятора"],"a":0,"why":"Наблюдаемая задержка диска превышает учебный порог и требует проверки причины."},{"title":"Сопоставьте данные","text":"В 02:04 журнал копирования сообщил о нехватке места, в 02:05 задание завершилось с кодом ошибки.","q":"Какой вывод доказан?","o":["Копирование завершилось неуспешно","Все старые копии повреждены","Заражение доказано"],"a":0,"why":"Журналы подтверждают сбой копирования, но не состояние всех старых копий."},{"title":"Разделите факт и гипотезу","text":"Пользователи сообщают о медленном доступе к общей папке, запись диска показывает высокую задержку.","q":"Что из следующего является гипотезой?","o":["В 09:00 задержка была 64 миллисекунды","Диск может иметь перегрузку входящих запросов","Сотрудники сообщили о замедлении"],"a":1,"why":"Причину требуется подтвердить дополнительными измерениями."},{"title":"Выберите способ подтверждения","text":"Есть предупреждение о повышенной задержке диска E:.","q":"Какие данные полезно собрать?","o":["Очередь операций, задержки чтения и записи, свободное место","Только цвет обоев","Только имя директора"],"a":0,"why":"Нужны данные, отражающие работу накопителя."},{"title":"Проверьте сценарий копирования","text":"Для новой копии нужно 22 ГБ, рабочий запас — 5 ГБ, свободно 48 ГБ.","q":"Поместятся ли две полные копии с запасом?","o":["Да, останется 9 ГБ","Нет, требуется 49 ГБ, не хватает 1 ГБ","Нет, требуется 80 ГБ"],"a":1,"why":"22 + 22 + 5 = 49 гигабайт, доступно 48."},{"title":"Оцените пригодность копии","text":"B-101 прошла тест открытия трёх файлов; B-102 содержит нечитаемый контрольный файл.","q":"Что обоснованно сделать?","o":["Проверить B-101 по плану восстановления и не считать B-102 надёжной","Удалить B-101","Объявить все копии исправными"],"a":0,"why":"Результат восстановления важнее факта существования копии."},{"title":"Составьте мониторинг","text":"Внутреннее учебное правило — тревога после двух последовательных превышений задержки диска 40 мс.","q":"Какое правило уменьшает ложные тревоги?","o":["Тревога при одном случайном пике","Тревога при двух последовательных превышениях","Полное отключение мониторинга"],"a":1,"why":"Несколько наблюдений помогают отличить кратковременные пики от устойчивых отклонений."},{"title":"Проработайте действия при ошибке","text":"Сценарий не смог записать копию на сетевое хранилище.","q":"Как правильно реагировать?","o":["Записать ошибку, остановить опасные действия, уведомить ответственного","Удалить последнюю рабочую копию","Игнорировать ошибку"],"a":0,"why":"Нельзя уничтожать единственную проверенную копию при сбое."}];
let page=0;
const answers=Array(tasks.length).fill(null);
const details={fio:"",group:"",conclusion:""};
const el=id=>document.getElementById(id);
const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function capture(){
  const f=el("fio"),g=el("group"),c=el("conclusion");
  if(f)details.fio=f.value;if(g)details.group=g.value;if(c)details.conclusion=c.value;
}
function score(){return tasks.reduce((a,t,i)=>a+(answers[i]===t.a?1:0),0)}
function choose(index){
  if(page<1||page>tasks.length)return;
  answers[page-1]=index;render();
}
function setPage(next){
  capture();
  if(page===0&&next>0&&(!details.fio.trim()||!details.group.trim())){alert("Введите ФИО и группу перед началом.");return;}
  page=Math.max(0,Math.min(tasks.length+2,next));render();
  window.scrollTo({top:0,behavior:"instant"});
}
function render(){
  const total=tasks.length+3;
  el("counter").textContent=(page+1)+" / "+total;
  el("back").disabled=page===0;
  el("next").textContent=page===total-1?"В начало ↺":"Далее →";
  el("progress").textContent=page===0?"Начало":page<=tasks.length?"Задание "+page+" из "+tasks.length:page===tasks.length+1?"Заключение":"Полный отчёт";
  let content="";
  if(page===0){
    content='<h1>Практическая лаборатория</h1><div class="case">Вы специалист технической поддержки. Проверьте учебные ситуации: состояние файлового сервера, данные событий, копирование и настройки мониторинга. Решения должны опираться на факты, а не догадки.</div><p class="muted">Все цифры учебные. Доступны исправление выбранного ответа, переходы назад и вперёд и полная выгрузка отчёта.</p><div class="form-row"><label for="fio">Фамилия, имя</label><input id="fio" autocomplete="name" placeholder="Иванов Иван" value="'+escapeHtml(details.fio)+'"></div><div class="form-row"><label for="group">Группа</label><input id="group" placeholder="ИСП-215" value="'+escapeHtml(details.group)+'"></div>';
  }else if(page<=tasks.length){
    const i=page-1,t=tasks[i],sel=answers[i];
    content='<h1>'+escapeHtml(t.title)+'</h1><div class="case">'+escapeHtml(t.text)+'</div><p><strong>'+escapeHtml(t.q)+'</strong></p><div class="options">'+t.o.map((option,j)=>'<button type="button" class="option '+(sel===null?'':j===t.a?'correct':j===sel?'incorrect':'')+' '+(sel===j?'chosen':'')+'" data-choice="'+j+'" aria-pressed="'+(sel===j)+'">'+escapeHtml(option)+'</button>').join("")+'</div>';
    if(sel!==null)content+='<div class="feedback">'+(sel===t.a?"✅ Верно. ":"🔎 Ответ можно исправить. ")+escapeHtml(t.why)+'</div>';
  }else if(page===tasks.length+1){
    content='<h1>Диагностическое заключение</h1><div class="case">Опишите подтверждённый факт, две возможные причины, способы их проверки и предложите безопасное действие. Не выдавайте гипотезу за доказанную причину.</div><p><label for="conclusion">Заключение студента</label></p><textarea id="conclusion" placeholder="Факт: ...&#10;Гипотеза 1: ...&#10;Гипотеза 2: ...&#10;Проверка: ...&#10;Рекомендация: ...">'+escapeHtml(details.conclusion)+'</textarea>';
  }else{
    content='<h1>Готово: результаты и полный отчёт</h1><div class="summary"><strong>'+score()+' из '+tasks.length+' правильных ответов.</strong><p>В отчёт включены ФИО, группа, все исходные данные восьми ситуаций, вопросы, выбранные и правильные ответы, отметка о проверке, пояснения и диагностическое заключение. Незаполненные задания также отмечаются.</p></div><div class="export-grid"><button class="action" id="downloadHtml">Скачать полный отчёт HTML</button><button class="action" id="downloadTxt">Скачать полный отчёт TXT</button><button class="action" id="printReport">Печать / сохранить PDF</button></div><p class="muted">Открытые ответы оценивает преподаватель. Для передачи результата достаточно отправить файл отчёта.</p>';
  }
  el("view").innerHTML=content;
  el("view").querySelectorAll("[data-choice]").forEach(b=>b.addEventListener("click",()=>choose(Number(b.dataset.choice))));
  if(el("downloadHtml"))el("downloadHtml").addEventListener("click",()=>exportReport("html"));
  if(el("downloadTxt"))el("downloadTxt").addEventListener("click",()=>exportReport("txt"));
  if(el("printReport"))el("printReport").addEventListener("click",()=>printReport());
}
function rows(){return tasks.map((t,i)=>({number:i+1,title:t.title,data:t.text,question:t.q,selected:answers[i]===null?"Ответ не выбран":t.o[answers[i]],correct:t.o[t.a],status:answers[i]===null?"Не отвечено":answers[i]===t.a?"Верно":"Неверно",explanation:t.why}));}
function reportHtml(){
  const line=rows().map(r=>'<section><h2>'+r.number+'. '+escapeHtml(r.title)+'</h2><p><b>Исходные данные:</b> '+escapeHtml(r.data)+'</p><p><b>Вопрос:</b> '+escapeHtml(r.question)+'</p><p><b>Ответ студента:</b> '+escapeHtml(r.selected)+'</p><p><b>Правильный ответ:</b> '+escapeHtml(r.correct)+'</p><p><b>Проверка:</b> '+escapeHtml(r.status)+'</p><p><b>Разъяснение:</b> '+escapeHtml(r.explanation)+'</p></section>').join("");
  return '<!doctype html><html lang="ru"><head><meta charset="UTF-8"><title>Полный отчёт — мониторинг</title><style>body{font:17px/1.5 Arial;color:#14283d;max-width:900px;margin:35px auto;padding:20px}section{border-top:2px solid #9ac1d2;padding:12px 0}h1{font-size:30px}h2{font-size:22px}@media print{body{margin:0;padding:0}section{break-inside:avoid}}</style></head><body><h1>Полный отчёт практикума</h1><p><b>Тема:</b> Системы мониторинга, диагностики и обеспечения безопасности</p><p><b>ФИО:</b> '+escapeHtml(details.fio)+'</p><p><b>Группа:</b> '+escapeHtml(details.group)+'</p><p><b>Результат:</b> '+score()+' из '+tasks.length+'</p>'+line+'<section><h2>Диагностическое заключение</h2><p style="white-space:pre-wrap">'+escapeHtml(details.conclusion||"Не заполнено")+'</p></section><p>Примечание: учебные исходные данные, а не результаты реальных измерений. Заключение проверяется преподавателем.</p></body></html>';
}
function reportText(){
  return ['ПОЛНЫЙ ОТЧЁТ ПРАКТИКУМА','Тема: Системы мониторинга, диагностики и обеспечения безопасности','ФИО: '+details.fio,'Группа: '+details.group,'Результат: '+score()+' из '+tasks.length,...rows().flatMap(r=>['',r.number+'. '+r.title,'Исходные данные: '+r.data,'Вопрос: '+r.question,'Ответ студента: '+r.selected,'Правильный ответ: '+r.correct,'Проверка: '+r.status,'Разъяснение: '+r.explanation]),'','ДИАГНОСТИЧЕСКОЕ ЗАКЛЮЧЕНИЕ',details.conclusion||"Не заполнено",'','Данные учебные. Заключение проверяется преподавателем.'].join("\n");
}
function download(content,mime,name){
  const a=document.createElement("a"),url=URL.createObjectURL(new Blob(["\ufeff"+content],{type:mime}));
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function exportReport(format){capture();const n="Мониторинг_отчет_"+(details.group||"группа").replace(/[^a-zа-яё0-9_-]/gi,"_");if(format==="html")download(reportHtml(),"text/html;charset=utf-8",n+".html");else download(reportText(),"text/plain;charset=utf-8",n+".txt")}
function printReport(){capture();const win=window.open("","_blank");if(!win){alert("Разрешите всплывающие окна, чтобы открыть печатную форму. Полный отчёт также можно скачать в HTML.");return;}win.document.open();win.document.write(reportHtml());win.document.close();win.focus();setTimeout(()=>win.print(),350)}
el("back").addEventListener("click",()=>setPage(page-1));
el("next").addEventListener("click",()=>setPage(page===tasks.length+2?0:page+1));
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","BUTTON"].includes(document.activeElement?.tagName))return;if(e.key==="ArrowRight")setPage(page+1);if(e.key==="ArrowLeft")setPage(page-1)});
render();
</script></body></html>
