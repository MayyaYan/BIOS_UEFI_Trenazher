<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практикум ИБ — Этап 1</title><style>body{font:22px/1.5 Arial;background:#071a32;color:#edf7ff;margin:0}header{padding:17px;background:#102f50}main{max-width:1100px;margin:24px auto;padding:24px;border-radius:24px;background:#123355;min-height:70vh}h1{font-size:34px}button{font:inherit;cursor:pointer;color:#062342;background:#80d8ff;border:0;border-radius:12px;padding:12px;margin:8px}button:disabled{opacity:.4}.answer{display:block;background:#224e74;color:#fff;width:100%;text-align:left}.selected{outline:3px solid #7fefb3}input,textarea{padding:12px;background:#092441;color:white;border:1px solid #78bce8;border-radius:9px;font:inherit;max-width:95%;width:600px}textarea{height:100px}.muted{color:#c4dceb}.hidden{display:none}.nav{display:flex;justify-content:space-between}.card{background:#0a2542;padding:18px;border-radius:16px;margin:15px 0}a{color:#82d9ff}@media(max-width:700px){body{font-size:19px}main{margin:10px;padding:16px}h1{font-size:27px}}</style></head><body><header>🛡️ Стандарты информационной безопасности · практический этап 1</header><main><h1 id="title">Практическая работа: Этап 1</h1><div id="content"></div><div class="nav"><button id="back" onclick="move(-1)">← Назад</button><span id="page"></span><button id="forward" onclick="move(1)">Далее →</button></div></main><script>
const questions=[["Какой стандарт устанавливает требования к СМИБ?",["ISO/IEC 27001:2022","ISO/IEC 27005:2022","NIST CSF 2.0"],0],["Какой стандарт содержит рекомендации по рискам ИБ?",["ISO/IEC 27005:2022","ISO/IEC 27001:2022","TLS 1.3"],0],["Что представляет собой NIST CSF 2.0?",["Система функций и результатов управления киберрисками","Сетевой протокол","Российский ГОСТ"],0],["Посторонний прочитал закрытые данные. Что нарушено?",["Конфиденциальность","Целостность","Доступность"],0],["Оценка была изменена без разрешения. Что нарушено?",["Доступность","Целостность","Конфиденциальность"],1],["Сервис недоступен во время экзамена. Что нарушено?",["Доступность","Конфиденциальность","Целостность"],0],["Утверждение политики и ответственности руководства относится к функции…",["Govern","Detect","Recover"],0],["Мониторинг подозрительных попыток входа относится к…",["Detect","Respond","Identify"],0],["Восстановление сервиса после инцидента относится к…",["Recover","Protect","Govern"],0],["Какое утверждение верно?",["ISO/IEC 27001 устанавливает требования к СМИБ","ISO/IEC 27005 — сетевой протокол","NIST CSF 2.0 — обязательный закон РФ"],0],["Что правильно относительно ГОСТ Р ИСО/МЭК 27001-2021?",["Это российский стандарт с отличающимся годом редакции","Это точное обозначение ISO/IEC 27001:2022","Это спецификация языка HTML"],0],["Какая мера снижает риск захвата учётной записи?",["Многофакторная аутентификация","Общий пароль для отдела","Выключение журналов событий"],0]];
let page=0,answers={};const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){
$('back').disabled=page===0;$('forward').disabled=page===14;$('page').textContent=(page+1)+' / 15';
if(page===0){$('title').textContent='Практическая работа · Этап 1';$('content').innerHTML='<div class="card"><p>Кейс: образовательная организация «Цифровой кампус». Выберите подходящие стандарты и меры защиты. После онлайн-заданий продолжите работу в Word и Excel.</p><p>12 вопросов × 5 баллов = 60 баллов. Отдельно открытые вопросы. Без таймера. Результаты сохраняются локально в текстовый файл.</p></div><p>ФИО <input id="fio" placeholder="Фамилия Имя" value="'+esc(answers.fio||'')+'"></p><p>Группа <input id="group" placeholder="Группа" value="'+esc(answers.group||'')+'"></p>';}
else if(page<=12){let q=questions[page-1];$('title').textContent='Задание '+page+' из 12';$('content').innerHTML='<div class="card"><b>'+esc(q[0])+'</b></div>'+q[1].map((a,i)=>'<button class="answer '+(answers[page]===i?'selected':'')+'" onclick="choose('+i+')">'+esc(a)+'</button>').join('');}
else if(page===13){$('title').textContent='Разбор инцидента';$('content').innerHTML='<div class="card">В электронном журнале используется общая учётная запись. Обнаружено несанкционированное изменение оценок. Опишите угрозу, меры защиты и нужные журналы событий.</div>'+['Что могло произойти и каковы последствия?','Предложите две конкретные меры защиты.','Какие журналы событий помогут провести расследование?'].map((t,i)=>'<p>'+t+'</p><textarea id="a'+i+'">'+esc(answers['open'+i]||'')+'</textarea>').join('');}
else{let s=score();$('title').textContent='Результат и переход к этапу 2';$('content').innerHTML='<div class="card"><h1>'+s+' / 60 баллов</h1><p>Открытые ответы проверяет преподаватель. В Excel рассчитайте риски R1–R5, в Word подготовьте аналитическую записку.</p><p>Исходные учебные показатели: R1 (4×5), R2 (3×5), R3 (3×4), R4 (4×3), R5 (3×3).</p><button onclick="download()">Скачать результаты (.txt)</button></div><p><a href="https://www.iso.org/standard/27001">ISO/IEC 27001:2022</a> · <a href="https://www.iso.org/standard/80585.html">ISO/IEC 27005:2022</a> · <a href="https://www.nist.gov/cyberframework/faqs">NIST CSF 2.0</a> · <a href="https://protect.gost.ru/gost/details/5e4acc56-cecf-41d4-a64f-95b3bac0d54f">ГОСТ Р ИСО/МЭК 27001-2021</a></p><p class="muted">Учебная шкала рисков P×I не является обязательной методикой ISO. Работа автономна, за исключением внешних ссылок.</p>';}
}
function choose(i){answers[page]=i;draw()}
function save(){if(page===0){answers.fio=$('fio').value;answers.group=$('group').value}if(page===13)for(let i=0;i<3;i++)answers['open'+i]=$('a'+i).value}
function move(d){save();if(page===0&&d>0&&(!answers.fio.trim()||!answers.group.trim())){alert('Введите ФИО и группу');return}page=Math.min(14,Math.max(0,page+d));draw();window.scrollTo(0,0)}
function score(){return questions.reduce((n,q,i)=>n+(answers[i+1]===q[2]?5:0),0)}
function download(){let t='Этап 1 — стандарты ИБ\nФИО: '+answers.fio+'\nГруппа: '+answers.group+'\nБаллы: '+score()+'/60\n';questions.forEach((q,i)=>t+='\n'+(i+1)+'. '+q[0]+'\nОтвет: '+(answers[i+1]===undefined?'не выбран':q[1][answers[i+1]])+'\n');for(let i=0;i<3;i++)t+='\nОткрытый ответ '+(i+1)+': '+(answers['open'+i]||'')+'\n';let a=document.createElement('a'),b=new Blob([t],{type:'text/plain;charset=utf-8'});a.href=URL.createObjectURL(b);a.download='IB_etap1_otvety.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
draw();</script></body></html>
