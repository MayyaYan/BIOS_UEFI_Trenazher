<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка документов о соответствии</title>
<style>

/* Практическая работа «Схемы сертификации: проверка документов о соответствии» — этап 1. Сцена 1280×720, основной кегль 22 pt. */
:root{
  --ink:#1B1E3A; --muted:#55597A; --pr:#3730A3; --pr-d:#2A2560; --pr-soft:#E8E7FA; --ac:#D9621C; --ac-d:#A6461A; --ac-soft:#FDEBDD;
  --gn:#1F8A5B; --gn-soft:#E0F3EA; --bad:#B3261E; --bad-soft:#FBE6E3; --paper:#FFFDF8; --bg:#F3F2EC; --line:#D9D6CA;
  --f:"Segoe UI","Roboto","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-size:22pt}
html,body{height:100%}
body{margin:0;background:#1A1840;color:var(--ink);font-family:var(--f);line-height:1.28;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
h1,h2{margin:0;line-height:1.15}
h1{font-size:1.4rem;color:var(--pr)}
h2{font-size:1.15rem;color:var(--pr-d);margin-bottom:10px;flex:none}
p{margin:0 0 8px}
ul,ol{margin:0}
svg{display:block}
.viewport{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);overflow:hidden}

/* шапка */
.top{position:absolute;left:0;right:0;top:0;height:70px;background:var(--pr-d);color:#fff;display:flex;align-items:center;gap:16px;padding:0 24px}
.logo{flex:none;width:46px;height:46px;color:#FFB98A}
.logo svg{width:100%;height:100%}
.top-t{flex:1;min-width:0;display:flex;align-items:baseline;gap:14px;white-space:nowrap;overflow:hidden}
.top-t p{margin:0}
.top-k{color:#FFB98A;font-weight:700}
.top-n{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.rail{flex:none;display:flex;gap:8px;list-style:none;padding:0}
.rail button{width:52px;height:52px;border-radius:50%;border:3px solid #6D66D6;background:transparent;color:#fff;font-weight:700;padding:0;line-height:1}
.rail button.v{background:#4B44B8}
.rail button.q{background:var(--gn);border-color:var(--gn)}
.rail button.on{border-color:#FFB98A;box-shadow:0 0 0 3px #FFB98A}

/* лента */
.win{position:absolute;left:0;right:0;top:70px;bottom:70px;overflow:hidden}
.track{display:flex;height:100%;transition:transform .45s cubic-bezier(.4,.1,.2,1);will-change:transform}
.track.noanim{transition:none}
.sl{flex:none;width:1280px;height:100%;padding:12px 34px 8px;overflow:hidden;display:flex;flex-direction:column}
@media (prefers-reduced-motion:reduce){.track{transition:none}}
.nav{position:absolute;left:0;right:0;bottom:0;height:70px;background:#fff;border-top:2px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px}
.cnt{flex:1;margin:0;text-align:center;color:var(--muted)}
.nb{border:0;border-radius:12px;background:var(--pr);color:#fff;font-weight:700;padding:6px 22px;min-height:52px}
.nb:disabled{opacity:.35;cursor:default}
.nb.ghost{background:#fff;color:var(--pr);border:3px solid var(--pr)}

/* общие */
.t{color:var(--pr);font-weight:700;border-bottom:3px dotted var(--ac);cursor:help}
.vcc span svg,.af-h .ic svg,.vl-h span svg{width:100%;height:100%}
.lead{flex:none}
.note{flex:none;background:var(--ac-soft);border-left:10px solid var(--ac);border-radius:12px;padding:10px 18px;margin:12px 0 0}
.main{flex:none;margin:10px 0 0;display:flex;align-items:center;gap:14px;background:var(--pr-d);color:#fff;border-radius:12px;padding:6px 16px 6px 6px}
.main b{flex:none;background:#FFB98A;color:var(--pr-d);border-radius:8px;padding:4px 12px}
.ph{margin:0;position:relative;border-radius:16px;overflow:hidden;background:#ddd}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;background:rgba(27,30,58,.82);color:#fff;padding:8px 14px;font-weight:600}


.score{flex:none;margin:0;background:#FFB98A;color:var(--pr-d);font-weight:800;border-radius:30px;padding:4px 16px}
.ic svg{width:100%;height:100%}

/* заголовок задания */
.th{display:flex;align-items:center;gap:16px;flex:none;margin-bottom:6px}
.th h2{margin:0;flex:1;min-width:0}
.chk{flex:none}
.lead{margin:0 0 8px}
.fb{flex:none;margin:8px 0 0;border-radius:12px;padding:6px 14px;background:#fff;border-left:10px solid var(--line)}
.fb.ok{border-left-color:var(--gn)}.fb.mid{border-left-color:var(--ac)}.fb.bad{border-left-color:var(--bad)}
.fb:empty{display:none}

/* вступление */
.intro{display:grid;grid-template-columns:1fr 470px;gap:24px;flex:1;min-height:0}
.intro-l p{margin:0 0 10px}
.sit{background:var(--paper);border-left:10px solid var(--ac);border-radius:14px;padding:12px 18px}
.route{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.route li{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:2px 12px 2px 2px}
.pn{flex:none;width:46px;height:46px;border-radius:10px;background:var(--pr);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.kit{display:flex;flex-direction:column;gap:10px}
.kit-h{font-weight:800;color:var(--pr-d);margin:0}
.kd{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;border-left:10px solid var(--pr)}
.kd.d{border-left-color:var(--gn)}
.kd b.l{flex:none;width:46px;height:46px;border-radius:50%;background:var(--pr-soft);color:var(--pr);display:flex;align-items:center;justify-content:center}
.kd p{margin:0;line-height:1.2}

/* задание 1: документ и элементы схемы */
.t1{flex:1;min-height:0;display:grid;grid-template-columns:690px 1fr;gap:20px}
.doc{background:var(--paper);border:3px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0}
.doc-h{flex:none;margin:0;padding:6px 14px;background:var(--pr-d);color:#fff;border-radius:11px 11px 0 0;font-weight:700;line-height:1.2}
.doc-l{list-style:none;margin:0;padding:6px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.doc-l button{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:3px solid transparent;border-radius:10px;padding:4px 10px 4px 4px;line-height:1.2}
.doc-l button:hover{border-color:var(--pr-soft)}
.doc-l button.hit{border-color:var(--pr);background:var(--pr-soft)}
.doc-l .n{flex:none;min-width:40px;height:40px;border-radius:8px;background:var(--bg);color:var(--muted);font-weight:800;display:flex;align-items:center;justify-content:center}
.side{display:flex;flex-direction:column;gap:6px;min-height:0}
.el{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:12px;padding:4px 10px;line-height:1.15;min-height:52px}
.el .nm{flex:1}
.el .v{flex:none;font-weight:800;color:var(--pr);background:var(--pr-soft);border-radius:20px;padding:2px 12px}
.el.on{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.el.good{border-color:var(--gn);background:var(--gn-soft)}
.el.badx{border-color:var(--bad);background:var(--bad-soft)}


/* задание 2: сроки */
.t2{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;justify-content:center}
.dr{background:#fff;border-radius:14px;padding:10px 14px;border-left:10px solid var(--pr)}
.dr.d{border-left-color:var(--gn)}
.dr-q{margin:0 0 8px;line-height:1.25}
.dr-q b{color:var(--pr-d)}
.dr-c{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dr-c label{font-weight:700}
.dt{width:230px;border:3px solid var(--line);border-radius:10px;padding:4px 10px;background:#fff}
.dt.good{border-color:var(--gn);background:var(--gn-soft)}.dt.badx{border-color:var(--bad);background:var(--bad-soft)}
.tg{display:flex;gap:8px;margin-left:auto}
.tg button,.ch button{border:3px solid var(--line);background:#fff;border-radius:24px;padding:4px 16px;font-weight:700}
.tg button.sel,.ch button.sel{border-color:var(--pr);background:var(--pr);color:#fff}
.tg button.good,.ch button.good{border-color:var(--gn);background:var(--gn);color:#fff}
.tg button.badx,.ch button.badx{border-color:var(--bad);background:var(--bad);color:#fff}
.tl{flex:1;min-height:0;display:flex;align-items:center}
.tl svg{width:1212px;height:auto}

/* задание 3: конструктор процедуры */
.legend{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend .ic{width:40px;height:40px;border-radius:10px;padding:4px;color:#fff;display:inline-block}
.L0{background:var(--ac)}.L1{background:var(--pr)}.L2{background:var(--gn)}
.seq{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;justify-content:center}
.seq li{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:3px 6px;border:3px solid transparent;border-left-width:10px;border-left-color:var(--line)}
.seq li.l0{border-left-color:var(--ac)}.seq li.l1{border-left-color:var(--pr)}.seq li.l2{border-left-color:var(--gn)}
.seq li.good{border-color:var(--gn);background:var(--gn-soft)}.seq li.badx{border-color:var(--bad);background:var(--bad-soft)}
.mv{flex:none;width:46px;height:46px;border:0;border-radius:10px;background:var(--bg);color:var(--pr);font-weight:800;padding:0}
.mv:disabled{opacity:.3}
.sn{flex:none;width:40px;text-align:center;font-weight:800;color:var(--muted)}
.st{flex:1;line-height:1.15}
.ln{flex:none;width:52px;height:46px;border:3px solid var(--line);border-radius:10px;background:#fff;padding:3px;color:var(--muted)}
.ln.sel{color:#fff;border-color:transparent}
.ln.sel.L0x{background:var(--ac)}.ln.sel.L1x{background:var(--pr)}.ln.sel.L2x{background:var(--gn)}

/* задание 4: решение о приёмке */
.t4{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;justify-content:center}
.pr{background:#fff;border-radius:14px;padding:8px 14px;border-left:10px solid var(--pr)}
.pr-a{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.pr-a p{margin:0;flex:1;font-weight:700;color:var(--pr-d);line-height:1.2}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.ch.docs button{width:58px;padding:4px 0}
.pr-b{display:flex;align-items:center;gap:12px}
.pr-b .lab{color:var(--muted)}

/* итог */
.res{flex:1;min-height:0;display:grid;grid-template-columns:420px 1fr;gap:20px}
.rc{display:flex;flex-direction:column;gap:8px}
.rci{display:flex;justify-content:space-between;gap:10px;background:#fff;border-radius:12px;padding:6px 14px;border-left:10px solid var(--pr)}
.rci b{color:var(--pr-d)}
.rci.tot{background:var(--pr-d);color:#fff;border-left-color:#FFB98A}.rci.tot b{color:#fff}
.rx{display:flex;flex-direction:column;gap:8px;min-height:0}
.rx textarea{flex:1;min-height:0;width:100%;resize:none;border:3px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:22pt;line-height:1.25;background:#fff}
.rx-b{display:flex;gap:12px;flex-wrap:wrap}

/* узкие экраны */
html.free{font-size:17px}
html.free .stage{position:fixed;width:100%;transform:none;display:flex;flex-direction:column}
html.free .top{position:static;flex:none;height:auto;padding:8px 12px;flex-wrap:wrap;gap:8px}
html.free .logo{width:34px;height:34px}
html.free .top-t{flex-direction:column;gap:0;white-space:normal}
html.free .rail{width:100%;justify-content:space-between;gap:4px}
html.free .rail button{width:38px;height:38px;border-width:2px}
html.free .win{position:static;flex:1;min-height:0}
html.free .track{display:block;transform:none!important;height:100%}
html.free .sl{width:auto;height:100%;overflow-y:auto;padding:12px 14px 20px}
html.free .nav{position:static;flex:none;height:auto;padding:8px 10px;gap:8px;flex-wrap:wrap}
html.free .nb{padding:6px 12px;min-height:44px}
html.free .cnt{order:-1;flex-basis:100%}
html.free .intro,html.free .t1,html.free .res{display:flex;flex-direction:column;flex:none}
html.free .th{flex-wrap:wrap}
html.free .doc-l{overflow:visible}
html.free .tl svg{width:100%}
html.free .tg{margin-left:0}
html.free .dt{width:150px}
html.free .seq li{flex-wrap:wrap}
html.free .pr-a,html.free .pr-b{flex-wrap:wrap}
html.free .rx textarea{font-size:17px;min-height:240px}

/* задание 1: карточка элемента */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips .el{width:54px;min-height:0;height:54px;justify-content:center;padding:0;font-weight:800;border-radius:50%}
.chips .el.set{background:var(--pr-soft)}
.chips .el.on{border-color:var(--ac)}
.card{flex:1;min-height:0;background:#fff;border-radius:14px;padding:10px 16px;border-top:10px solid var(--ac);display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.card p{margin:0;line-height:1.2}
.card-k{color:var(--muted)}
.card-n{font-weight:800;color:var(--pr-d);font-size:1.05rem}
.card-v{font-weight:700;color:var(--pr)}
.card-h.ok{color:var(--gn)}.card-h.bad{color:var(--bad)}.card-h.mid{color:var(--ac-d)}
.card-b{display:flex;gap:8px}
.card-b .none{flex:1}
.side{gap:10px}
.t3fb{margin:0 0 8px}
.mv{height:40px;width:44px}
.ln{height:40px;width:50px;padding:2px}
.seq{gap:4px}
.seq li{padding:1px 6px}
.t3fb{padding:4px 12px;line-height:1.2}
.rc{gap:6px}
.rci{padding:4px 14px}
.seq li{flex:none}
.ln svg{width:100%;height:100%;display:block}

</style>
</head>
<body>
<div class="viewport" id="viewport">
<div class="stage" id="stage">
  <header class="top">

    <div class="top-t"><p class="top-k" id="stK">Практическая работа</p><p class="top-n" id="stN">Проверка документов о соответствии</p></div>

</div>
</div>

  $$('.ln',ol).forEach(function(b){b.addEventListener('click',function(){st.ln[+b.closest('li').dataset.si]=+b.dataset.ln;save();draw3(p)})});
  var c=$('#c3'+p);c.textContent=att(S.t3n[p]);c.disabled=done}
function posOK(p,ord,i){var P=PROC[p],si=ord[i];if(si===i)return true;return P.swap.some(function(w){return (si===w[0]&&i===w[1]&&ord[w[0]]===w[1])||(si===w[1]&&i===w[0]&&ord[w[1]]===w[0])})}
['p1','p2'].forEach(function(p){$('#c3'+p).addEventListener('click',function(){var st=S.t3[p],P=PROC[p],sec=$('.seq[data-p="'+p+'"]').closest('.sl'),ok=0;
  if(Object.keys(st.ln).length<P.steps.length){fb(sec,'Выберите исполнителя для каждого шага.','mid');$('.legend',sec).hidden=true;return}
  S.t3n[p]++;draw3(p);var lis=$$('li',$('.seq[data-p="'+p+'"]')),wrongLane=0,wrongPos=0;
  st.ord.forEach(function(si,i){var g1=posOK(p,st.ord,i),g2=st.ln[si]===P.steps[si][1];if(g1&&g2)ok++;if(!g1)wrongPos++;if(!g2)wrongLane++;lis[i].classList.add(g1&&g2?'good':'badx')});
  S.t3p[p]=Math.max(S.t3p[p],ok);save();upScore();rail();
  fb(sec,ok===P.steps.length?(p==='p1'?'Всё верно. В сертификате А акт анализа производства составлен раньше протоколов: шаги 4 и 5 можно менять местами.':'Всё верно. В схеме 1д орган по сертификации не участвует.'):'Верно '+ok+' из '+P.steps.length+'. Ошибок в порядке — '+wrongPos+', в исполнителе — '+wrongLane+'. '+(p==='p1'?'Решения и контроль — функции органа, испытания — лаборатории.':'В схеме 1д всё, кроме испытаний, делает заявитель.'),ok===P.steps.length?'ok':ok>=P.steps.length-2?'mid':'bad');$('.legend',sec).hidden=true})});

/* ---------- задание 4 ---------- */
$$('.pr').forEach(function(r){var i=+r.dataset.i,st=S.t4[i]||(S.t4[i]={});
  function paint(){$$('[data-d]',r).forEach(function(b){b.classList.toggle('sel',st.d===b.dataset.d)});$$('[data-c]',r).forEach(function(b){b.classList.toggle('sel',st.c===+b.dataset.c)})}
  $$('[data-d]',r).forEach(function(b){b.setAttribute('aria-label','Документ '+LET[b.dataset.d]);b.addEventListener('click',function(){if(S.t4n>=3)return;st.d=b.dataset.d;$$('button',r).forEach(function(x){x.classList.remove('good','badx')});save();paint()})});
  $$('[data-c]',r).forEach(function(b){b.addEventListener('click',function(){if(S.t4n>=3)return;st.c=+b.dataset.c;$$('button',r).forEach(function(x){x.classList.remove('good','badx')});save();paint()})});paint()});
$('#c4').addEventListener('click',function(){var sec=$('#c4').closest('.sl'),ok=0,tip=[];
  if(!ITEMS.every(function(it,i){var s=S.t4[i];return s&&s.d&&s.c!=null})){fb(sec,'Выберите документ и решение для всех четырёх изделий.','mid');return}
  S.t4n++;ITEMS.forEach(function(it,i){var s=S.t4[i],r=$('.pr[data-i="'+i+'"]'),need=valid(it[1])?0:1,g1=s.d===it[1],g2=s.c===need;
    if(g1)ok++;if(g2)ok++;if(!g1)tip.push('изделие '+(i+1)+': документ указан в строке «Продукция»');else if(!g2)tip.push('изделие '+(i+1)+': сравните окончание срока документа '+LET[it[1]]+' с сегодняшней датой');
    $('[data-d="'+s.d+'"]',r).classList.add(g1?'good':'badx');$('[data-c="'+s.c+'"]',r).classList.add(g2?'good':'badx')});
  S.t4p=Math.max(S.t4p,ok);save();upScore();rail();$('#c4').textContent=att(S.t4n);$('#c4').disabled=S.t4n>=3;
  fb(sec,ok===8?'Всё верно. Вопрос о точной модели UBA-LUX-503-TC вы разберёте во втором этапе.':'Верно '+ok+' из 8. Подсказка: '+tip.join('; ')+'.',ok===8?'ok':ok>=6?'mid':'bad')});

/* ---------- итог ---------- */
function summary(){var L=[];L.push('Практическая работа «Схемы сертификации: проверка документов о соответствии». Этап 1.');L.push('Дата выполнения: '+fd(TODAY)+'. Баллы: '+total()+' из 60.');
  L.push('');L.push('Задание 1. Доказательства схем: сертификат А — '+S.t1p.A+' из 14; декларация Б — '+S.t1p.B+' из 12.');
  ['A','B'].forEach(function(k){L.push(LET[k]+': '+EL[k].map(function(e,i){var v=S.t1[k][i];return e[0]+' — '+(v==null?'не указано':v===0?'в документе нет':'строка '+v)}).join('; ')+'.')});
  L.push('');L.push('Задание 2. Сроки действия ('+S.t2p+' из 12):');['A','B','C','D'].forEach(function(k){var s=S.t2[k]||{};L.push(LET[k]+' ('+DOCS[k].s+'): с '+(s.a||'—')+' по '+(s.b||'—')+'; статус на '+fd(TODAY)+': '+(s.s===1?'действует':s.s===0?'срок истёк':'не указан')+'.')});
  L.push('');L.push('Задание 3. Процедуры: схема 1с — '+S.t3p.p1+' из 8; схема 1д — '+S.t3p.p2+' из 6.');
  ['p1','p2'].forEach(function(p){L.push((p==='p1'?'1с: ':'1д: ')+S.t3[p].ord.map(function(si,i){var l=S.t3[p].ln[si];return (i+1)+') '+PROC[p].steps[si][0]+' ['+(l==null?'?':LANES[l][1])+']'}).join('; ')+'.')});
  L.push('');L.push('Задание 4. Решение о приёмке ('+S.t4p+' из 8):');ITEMS.forEach(function(it,i){var s=S.t4[i]||{};L.push((i+1)+'. '+it[0]+': документ '+(s.d?LET[s.d]:'—')+'; решение — '+(s.c!=null?DEC[s.c].toLowerCase():'не выбрано')+'.')});
  return L.join('\n')}
function drawRes(){var R=[['1а. Доказательства 1с',S.t1p.A,14],['1б. Доказательства 1д',S.t1p.B,12],['2. Сроки действия',S.t2p,12],['3а. Процедура 1с',S.t3p.p1,8],['3б. Процедура 1д',S.t3p.p2,6],['4. Приёмка',S.t4p,8]];
  $('#rc').innerHTML=R.map(function(r){return '<p class="rci"><span>'+r[0]+'</span><b>'+r[1]+' / '+r[2]+'</b></p>'}).join('')+'<p class="rci tot"><span>Итого</span><b>'+total()+' / 60</b></p>';$('#rtext').value=summary()}
$('#copy').addEventListener('click',function(){var t=summary(),done=function(ok){$('#copyfb').className='fb '+(ok?'ok':'mid');$('#copyfb').textContent=ok?'Результаты скопированы. Вставьте их в отчёт второго этапа.':'Выделите текст в поле и скопируйте его вручную.'};
  function legacy(){var ta=$('#rtext');ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}done(ok)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){done(true)},legacy)}else legacy()});
$('#reset').addEventListener('click',function(){if($('#reset').dataset.sure!=='1'){$('#reset').dataset.sure='1';$('#reset').textContent='Нажмите ещё раз для сброса';return}S=fresh();save();window.location.reload()});

/* ---------- масштаб и перелистывание ---------- */
var stage=$('#stage'),W0=1280,H0=720;
function fit(){var w=window.innerWidth,h=window.innerHeight;
  if(w<760){document.documentElement.classList.add('free');stage.style.transform='';stage.style.left='0';stage.style.top='0';stage.style.height=h+'px';place(true);return}
  document.documentElement.classList.remove('free');stage.style.height='';var k=Math.min(w/W0,h/H0);stage.style.transform='scale('+k+')';stage.style.left=Math.max(0,(w-W0*k)/2)+'px';stage.style.top=Math.max(0,(h-H0*k)/2)+'px';place(true)}
function firstOf(st){for(var i=0;i<N;i++)if(+sls[i].dataset.st===st)return i;return 0}
function stDone(s){return s===1?S.t1n.A&&S.t1n.B:s===2?S.t2n:s===3?S.t3n.p1&&S.t3n.p2:s===4?S.t4n:0}
function rail(){$('#rail').innerHTML=[1,2,3,4].map(function(s){var on=+sls[cur].dataset.st===s,d=stDone(s);return '<li><button type="button" data-st="'+s+'" class="'+(on?'on ':'')+(d?'q':'')+'" aria-label="Задание '+s+': '+STN[s]+(d?', проверено':'')+'"'+(on?' aria-current="step"':'')+'>'+(d?'✓':s)+'</button></li>'}).join('');
  $$('#rail button').forEach(function(b){b.addEventListener('click',function(){go(firstOf(+b.dataset.st))})})}
function place(instant){if(document.documentElement.classList.contains('free')){track.style.transform='';sls.forEach(function(s,i){s.hidden=i!==cur});return}
  sls.forEach(function(s){s.hidden=false});if(instant)track.classList.add('noanim');track.style.transform='translateX('+(-cur*W0)+'px)';if(instant){void track.offsetWidth;track.classList.remove('noanim')}}
function go(i){if(i<0||i>=N)return;cur=i;var s=sls[i],st=+s.dataset.st;
  sls.forEach(function(x,k){if(k===i){x.removeAttribute('inert');x.removeAttribute('aria-hidden')}else{x.setAttribute('inert','');x.setAttribute('aria-hidden','true')}});
  if(st===2)drawTL();if(st===5)drawRes();
  $('#stK').textContent=st===0?'Практическая работа':st===5?'Итог':'Задание '+st+' из 4';$('#stN').textContent=st===0?'Проверка документов о соответствии':STN[st];
  $('#cnt').textContent='Слайд '+(i+1)+' из '+N;$('#prev').disabled=i===0;$('#next').disabled=i===N-1;place(false);rail();s.scrollTop=0}
$('#prev').addEventListener('click',function(){go(cur-1)});$('#next').addEventListener('click',function(){go(cur+1)});
document.addEventListener('keydown',function(e){var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
  if(e.key==='PageDown'){e.preventDefault();go(cur+1)}else if(e.key==='PageUp'){e.preventDefault();go(cur-1)}});
window.addEventListener('resize',fit);
['A','B'].forEach(function(k){mark1(k,false);draw1(k)});draw3('p1');draw3('p2');
$('#c2').textContent=att(S.t2n);$('#c2').disabled=S.t2n>=3;$('#c4').textContent=att(S.t4n);$('#c4').disabled=S.t4n>=3;
upScore();window.PR={go:go,n:N,S:function(){return S},DOCS:DOCS,EL:EL,PROC:PROC,ITEMS:ITEMS,valid:valid};
fit();go(0);
})();

</script>
